<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carga Total</title>
<meta name="theme-color" content="#131518">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: cartão do atleta no topo (barra carregada = nível), depois medidas, gráfico, frequência, Strava, conquistas e histórico numa coluna. */
:root {
  --bg: #F1F2EE;
  --surface: #FFFFFF;
  --sunken: #E6E8E2;
  --ink: #17191D;
  --muted: #5C6169;
  --line: #D6D9D2;
  --bar: #8A9099;
  --p10: #2B9858;
  --p15: #D9A200;
  --p20: #2257C7;
  --p25: #CF2D39;
  --good: #1D8A4B;
  --bad: #C2363F;
  --strava: #E8590C;
  --xp: var(--p15);
  --pc: var(--p25);
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131518; --surface: #1C1F23; --sunken: #24282D; --ink: #ECEDEA; --muted: #9AA0A8; --line: #2D3137; --bar: #A9B0B9;
    --p10: #3DBA70; --p15: #F2C230; --p20: #4C82F0; --p25: #EF4B55; --good: #46C27C; --bad: #F06A72; --strava: #FF7A33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131518; --surface: #1C1F23; --sunken: #24282D; --ink: #ECEDEA; --muted: #9AA0A8; --line: #2D3137; --bar: #A9B0B9;
  --p10: #3DBA70; --p15: #F2C230; --p20: #4C82F0; --p25: #EF4B55; --good: #46C27C; --bad: #F06A72; --strava: #FF7A33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .01em; line-height: 1; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--xp); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-size: 40px; font-weight: 900; letter-spacing: .02em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.logo { width: 46px; height: 46px; flex: none; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.go { background: var(--p10); border-color: var(--p10); color: #fff; }
.btn.strava { background: var(--strava); border-color: var(--strava); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.note { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 14px; background: var(--surface); }
.note b { color: var(--ink); }

/* cartão do atleta */
.athlete { background: var(--surface); border: 1px solid var(--line); border-top: 8px solid var(--pc); border-radius: 18px; padding: 22px; display: grid; gap: 16px; }
.a-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 20px; align-items: center; }
.a-id { display: grid; gap: 14px; min-width: 0; }
.f-top { display: flex; align-items: center; gap: 12px; }
.mascot { font-size: 40px; line-height: 1; width: 60px; height: 60px; display: grid; place-items: center; background: var(--sunken); border-radius: 16px; flex: none; }
.f-name { min-width: 0; flex: 1; }
.f-name h2 { font-size: 34px; font-weight: 800; overflow-wrap: anywhere; }
.f-name p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.loadline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.load { font-family: var(--display); font-weight: 900; font-size: 84px; line-height: .85; }
.load small { font-size: 30px; font-weight: 800; margin-left: 4px; color: var(--muted); }
.lvl { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; color: var(--muted); }
.barbell { width: 100%; max-width: 480px; height: auto; display: block; margin-inline: auto; }
.xpbar { height: 12px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--xp); border-radius: 99px; transition: width .6s ease; }
.xptext { margin: -8px 0 0; font-size: 13px; color: var(--muted); }
.fstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0; }
.fstats div { background: var(--sunken); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.fstats dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fstats dd { margin: 2px 0 0; font-weight: 700; font-size: 17px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions .hint { color: var(--muted); font-size: 13px; }

.sec { display: grid; gap: 14px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 30px; font-weight: 800; }
.sec-head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }
.delta { display: inline-block; padding: 2px 8px; border-radius: 99px; font-weight: 700; font-size: 13px; background: var(--sunken); }
.delta.good { color: var(--good); }
.delta.bad { color: var(--bad); }
.spark { width: 96px; height: 26px; display: block; }
.chart svg { width: 100%; height: auto; display: block; }

.cal { display: grid; grid-template-columns: 28px repeat(16, minmax(0, 1fr)); gap: 4px; max-width: 620px; }
.cal .wd { font-size: 10px; color: var(--muted); align-self: center; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 4px; background: var(--sunken); border: 0; padding: 0; position: relative; }
.cell.on { background: var(--pc); }
.cell.strava { background: var(--strava); }
.cell.meas::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--surface); }
.cell.today { outline: 2px solid var(--ink); }
.cell.future { opacity: .35; }
button.cell:hover { filter: brightness(.9); }
.cal-wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.cal-side { display: grid; gap: 10px; min-width: 180px; }
.cal-side .big { font-family: var(--display); font-size: 48px; font-weight: 900; line-height: 1; }
.cal-side small { color: var(--muted); }
.cal-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
.cal-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

.acts { display: grid; gap: 0; }
.act { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act .d { font-family: var(--display); font-weight: 800; font-size: 20px; }
.act .t { min-width: 0; }
.act .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act .t small { color: var(--muted); }
.act .m { color: var(--muted); font-size: 13px; text-align: right; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.medal { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 20px; background: var(--sunken); color: var(--muted); border: 3px solid var(--line); }
.badge.won .medal { background: var(--xp); color: #1b1600; border-color: color-mix(in srgb, var(--xp) 60%, var(--ink)); }
.badge:not(.won) h3 { color: var(--muted); }
.badge h3 { font-family: var(--body); text-transform: none; font-size: 14.5px; font-weight: 700; letter-spacing: 0; }
.badge p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.35; }

.hrow { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hrow:last-child { border-bottom: 0; }
.hdate { font-family: var(--display); font-size: 22px; font-weight: 800; }
.hvals { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); min-width: 0; }
.hvals b { color: var(--ink); font-weight: 600; }
.hbtns { display: flex; gap: 6px; }

.login { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
.login h2 { font-size: 44px; font-weight: 900; }
.login p { color: var(--muted); }
.field { display: grid; gap: 5px; }
.field label, .field .lab { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.field .unit { position: relative; }
.field .unit input { padding-right: 40px; }
.field .unit span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.form { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick label { cursor: pointer; position: relative; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick span { min-width: 46px; height: 46px; display: grid; place-items: center; font-size: 26px; border-radius: 12px; background: var(--sunken); border: 2px solid transparent; }
.pick input:checked + span { border-color: var(--ink); background: var(--surface); }
.pick input:focus-visible + span { outline: 3px solid var(--xp); }
.pick .plate { width: 46px; border-radius: 50%; font-family: var(--display); font-size: 16px; font-weight: 900; color: #fff; }
.pick input:checked + .plate { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 3px solid var(--xp); }

.sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-card { background: var(--surface); border-radius: 18px; width: min(620px, 100%); max-height: 100%; overflow: auto; padding: 22px; display: grid; gap: 16px; border: 1px solid var(--line); }
.sheet-card h2 { font-size: 32px; font-weight: 900; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 60; width: min(420px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.25); animation: pop .25s ease-out; }
.toast.lvlup { background: var(--xp); color: #1b1600; font-family: var(--display); font-size: 22px; text-transform: uppercase; font-weight: 900; }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 55; width: 100%; height: 100%; }
footer { color: var(--muted); font-size: 12.5px; text-align: center; }
footer button { background: none; border: 0; color: inherit; text-decoration: underline; padding: 0; }

@media (max-width: 760px) {
  .a-main { grid-template-columns: 1fr; }
  .fstats { grid-template-columns: repeat(2, 1fr); }
  .load { font-size: 66px; }
  .login { grid-template-columns: 1fr; padding: 18px; }
  .login h2 { font-size: 36px; }
  .brand h1 { font-size: 32px; }
  .hrow { grid-template-columns: 1fr; gap: 6px; }
  .cal { grid-template-columns: 24px repeat(16, minmax(0, 1fr)); gap: 3px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 46 46" aria-hidden="true">
        <rect x="2" y="21" width="42" height="4" rx="2" fill="var(--bar)"/>
        <rect x="7" y="9" width="6" height="28" rx="2" fill="var(--p25)"/>
        <rect x="13" y="13" width="4" height="20" rx="1.5" fill="var(--p20)"/>
        <rect x="33" y="9" width="6" height="28" rx="2" fill="var(--p25)"/>
        <rect x="29" y="13" width="4" height="20" rx="1.5" fill="var(--p20)"/>
      </svg>
      <div>
        <h1>Carga Total</h1>
        <p>Seu placar de evolução. Cada medida e cada treino carrega a sua barra.</p>
      </div>
    </div>
  </header>

  <div id="banner" hidden></div>
  <section id="login" hidden></section>
  <section id="hero" aria-live="polite"><div class="athlete"><h2>Carregando…</h2></div></section>
  <section class="sec" id="metrics" hidden></section>
  <section class="sec" id="chart" hidden></section>
  <section class="sec" id="calendar" hidden></section>
  <section class="sec" id="strava" hidden></section>
  <section class="sec" id="badges" hidden></section>
  <section class="sec" id="history" hidden></section>
  <footer id="foot"></footer>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetCard"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti" hidden></canvas>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
"use strict";
// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymdLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const fromDay = n => new Date(n * 864e5).toISOString().slice(0, 10);
const addDays = (s, n) => fromDay(dayNum(s) + n);
const TODAY = ymdLocal(new Date());
const fmtDate = s => { const [, m, d] = s.split("-"); return `${d}/${m}`; };
const fmtDateLong = s => { const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const isNum = v => typeof v === "number" && isFinite(v);
const fmt = (v, dec = 2) => isNum(v) ? v.toLocaleString("pt-BR", { maximumFractionDigits: dec }) : "–";
const signed = (v, dec = 2) => (v > 0 ? "+" : v < 0 ? "−" : "±") + fmt(Math.abs(v), dec);
const parseDec = s => { const t = String(s ?? "").trim().replace(",", "."); if (!t) return null; const n = Number(t); return isFinite(n) ? n : NaN; };
const clone = o => JSON.parse(JSON.stringify(o));
const dur = s => { const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h}h${pad(m)}` : `${m} min`; };

// ---------- regras do jogo ----------
const GOALS = { emagrecer: "Emagrecer", ganhar: "Ganhar massa", recomp: "Recomposição" };
const METRICS = [
  { k: "weight", label: "Peso", unit: "kg", dir: { emagrecer: -1, ganhar: 1, recomp: 0 } },
  { k: "fat", label: "Gordura", unit: "%", dir: -1 },
  { k: "muscle", label: "Massa muscular", unit: "kg", dir: 1 },
  { k: "chest", label: "Peito", unit: "cm", dir: { emagrecer: 0, ganhar: 1, recomp: 1 } },
  { k: "waist", label: "Cintura", unit: "cm", dir: -1 },
  { k: "abdomen", label: "Abdômen", unit: "cm", dir: -1 },
  { k: "hip", label: "Quadril", unit: "cm", dir: { emagrecer: -1, ganhar: 0, recomp: 0 } },
  { k: "arm", label: "Braço D", unit: "cm", dir: { emagrecer: 0, ganhar: 1, recomp: 1 } },
  { k: "armL", label: "Braço E", unit: "cm", dir: { emagrecer: 0, ganhar: 1, recomp: 1 } },
  { k: "thigh", label: "Coxa D", unit: "cm", dir: { emagrecer: -1, ganhar: 1, recomp: 0 } },
  { k: "thighL", label: "Coxa E", unit: "cm", dir: { emagrecer: -1, ganhar: 1, recomp: 0 } },
  { k: "calf", label: "Panturrilha D", unit: "cm", dir: { emagrecer: 0, ganhar: 1, recomp: 0 } },
  { k: "calfL", label: "Panturrilha E", unit: "cm", dir: { emagrecer: 0, ganhar: 1, recomp: 0 } },
];
const dirOf = (m, goal) => typeof m.dir === "number" ? m.dir : (m.dir[goal] ?? 0);
const MASCOTS = ["🦍", "🐯", "🦁", "🐺", "🐻", "🦊", "🐼", "🐸", "🦈", "🦅", "🐙", "🦄", "🐝", "🐢"];
const COLORS = { p25: "25", p20: "20", p15: "15", p10: "10" };
const SPORTS = { Run: "Corrida", TrailRun: "Trilha", Ride: "Pedal", VirtualRide: "Pedal indoor", Walk: "Caminhada", Hike: "Trilha a pé", Swim: "Natação", WeightTraining: "Musculação", Workout: "Treino", Crossfit: "Crossfit", HighIntensityIntervalTraining: "HIIT", Yoga: "Yoga", Pilates: "Pilates", Elliptical: "Elíptico", StairStepper: "Escada", Rowing: "Remo", Soccer: "Futebol", Tennis: "Tênis" };
// Cada nível coloca mais um par de anilhas na barra olímpica de 20 kg.
const PLATES = [10, 15, 20, 25, 25, 25, 25, 25, 25, 25, 25, 25];
const PLATE_COLOR = { 10: "var(--p10)", 15: "var(--p15)", 20: "var(--p20)", 25: "var(--p25)" };
const needXp = L => 50 * (L - 1) * (L + 2);
const loadOf = L => 20 + 2 * PLATES.slice(0, Math.min(L - 1, PLATES.length)).reduce((a, b) => a + b, 0);
function levelOf(xp) { let L = 1; while (xp >= needXp(L + 1)) L++; return { level: L, from: needXp(L), to: needXp(L + 1), load: loadOf(L), nextLoad: loadOf(L + 1) }; }
const XP = { measure: 100, checkin: 25, improve: 20, badge: 50 };

const sortedMs = p => (p.measurements || []).slice().sort((a, b) => a.date.localeCompare(b.date));
const firstVal = (ms, k) => { for (const m of ms) if (isNum(m[k])) return m[k]; return null; };
const lastVal = (ms, k) => { for (let i = ms.length - 1; i >= 0; i--) if (isNum(ms[i][k])) return ms[i][k]; return null; };
const prevVal = (ms, k) => { let n = 0; for (let i = ms.length - 1; i >= 0; i--) if (isNum(ms[i][k])) { if (n++ === 1) return ms[i][k]; } return null; };
const mondayOf = s => { const n = dayNum(s); const wd = (new Date(n * 864e5).getUTCDay() + 6) % 7; return n - wd; };

const BADGES = [
  { id: "first", glyph: "1ª", name: "Primeira pesagem", desc: "Registrou a primeira medição.", test: c => c.ms.length >= 1 },
  { id: "fortnight", glyph: "15d", name: "Quinzena firme", desc: "Duas medições com 12 dias ou mais de intervalo.", test: c => c.ms.length >= 2 && dayNum(c.ms[c.ms.length - 1].date) - dayNum(c.ms[0].date) >= 12 },
  { id: "waist", glyph: "−2", name: "Cintura em queda", desc: "2 cm a menos de cintura desde o início.", test: c => c.delta("waist") <= -2 },
  { id: "scale", glyph: "kg", name: "Balança a favor", desc: "Peso 2 kg na direção do objetivo (1,5 kg para quem quer ganhar massa).", test: c => c.goal === "emagrecer" ? c.delta("weight") <= -2 : c.goal === "ganhar" ? c.delta("weight") >= 1.5 : false },
  { id: "fat", glyph: "%", name: "Queima-gordura", desc: "1 ponto a menos de % de gordura.", test: c => c.delta("fat") <= -1 },
  { id: "arm", glyph: "B+", name: "Braço de aço", desc: "1 cm a mais de braço.", test: c => Math.max(c.delta("arm") || 0, c.delta("armL") || 0) >= 1 },
  { id: "triple", glyph: "3↑", name: "Tripla vitória", desc: "3 medidas melhoraram de uma medição para a seguinte.", test: c => c.bestJump >= 3 },
  { id: "week4", glyph: "4x", name: "Semana cheia", desc: "4 treinos na mesma semana.", test: c => Math.max(0, ...c.weeks.values()) >= 4 },
  { id: "streak", glyph: "3s", name: "Constância", desc: "3 semanas seguidas com 3 treinos ou mais.", test: c => c.bestStreak >= 3 },
  { id: "club20", glyph: "20", name: "Clube dos 20", desc: "20 dias de treino.", test: c => c.checkins.length >= 20 },
  { id: "club50", glyph: "50", name: "Clube dos 50", desc: "50 dias de treino.", test: c => c.checkins.length >= 50 },
  { id: "strava", glyph: "S", name: "Sincronizado", desc: "Conectou o Strava e trouxe o primeiro treino.", test: c => (c.p.strava?.activities || []).length > 0 },
];

function stats(p) {
  const ms = sortedMs(p);
  const goal = p.goal || "recomp";
  let improvements = 0, bestJump = 0;
  for (let i = 1; i < ms.length; i++) {
    let jump = 0;
    for (const m of METRICS) {
      const d = dirOf(m, goal), a = ms[i - 1][m.k], b = ms[i][m.k];
      if (d && isNum(a) && isNum(b) && d * (b - a) > 0) jump++;
    }
    improvements += jump; bestJump = Math.max(bestJump, jump);
  }
  const checkins = [...new Set(p.checkins || [])].filter(d => d <= TODAY && counts(d)).sort();
  const weeks = new Map();
  for (const d of checkins) { const w = mondayOf(d); weeks.set(w, (weeks.get(w) || 0) + 1); }
  // sequência: semanas seguidas com 3+ treinos; a semana atual só conta depois de bater a meta
  const thisWeek = mondayOf(TODAY);
  let w = (weeks.get(thisWeek) || 0) >= 3 ? thisWeek : thisWeek - 7, streak = 0;
  while ((weeks.get(w) || 0) >= 3) { streak++; w -= 7; }
  let bestStreak = 0, run = 0;
  [...weeks.keys()].sort((a, b) => a - b).forEach((k, i, arr) => { run = weeks.get(k) >= 3 ? ((i && arr[i - 1] === k - 7 && weeks.get(arr[i - 1]) >= 3) ? run + 1 : 1) : 0; bestStreak = Math.max(bestStreak, run); });
  const delta = k => { const a = firstVal(ms, k), b = lastVal(ms, k); return isNum(a) && isNum(b) ? b - a : 0; };
  let score = 0;
  for (const m of METRICS) {
    const d = dirOf(m, goal), a = firstVal(ms, m.k), b = lastVal(ms, m.k);
    if (d && isNum(a) && isNum(b) && a) score += d * (b - a) / a * 100;
  }
  const badges = BADGES.filter(b => b.test({ p, ms, goal, checkins, weeks, bestStreak, bestJump, delta })).map(b => b.id);
  const xp = ms.length * XP.measure + checkins.length * XP.checkin + improvements * XP.improve + badges.length * XP.badge;
  const last = ms[ms.length - 1];
  const nextIn = last ? dayNum(addDays(last.date, 15)) - dayNum(TODAY) : null;
  return { ms, goal, improvements, checkins, weeks, streak, score: Math.round(score * 10) / 10, badges, xp, nextIn, ...levelOf(xp) };
}

// ---------- estado ----------
const cfg = window.CARGA_CONFIG || {};
const configured = !!(cfg.url && cfg.anonKey && !/SEU-PROJETO|SUA-ANON/.test(cfg.url + cfg.anonKey));
const stravaReady = !!(cfg.stravaClientId && !/SEU/.test(String(cfg.stravaClientId)));
const S = { mode: "loading", me: null, email: "", p: null, chart: "weight", loaded: false, error: "", armed: null, sent: "", auth: "login", lastEmail: "", syncing: false };
let sb = null;
const pageUrl = () => location.origin + location.pathname;
const START = /^\d{4}-\d{2}-\d{2}$/.test(cfg.inicio || "") ? cfg.inicio : "";
const counts = d => S.mode === "demo" || !START || d >= START;

// ---------- dados ----------
async function boot() {
  render();
  if (!configured || !window.supabase) return startDemo(true);
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  sb.auth.onAuthStateChange((ev, session) => {
    if (session && !S.me) start(session);
    if (ev === "PASSWORD_RECOVERY") setTimeout(() => passwordSheet(true), 300);
    if (ev === "SIGNED_OUT") location.reload();
  });
  const { data } = await sb.auth.getSession();
  if (data.session) start(data.session);
  else if (!S.me) { S.mode = "login"; render(); }
}

async function start(session) {
  if (S.me) return;
  S.mode = "live"; S.me = session.user.id; S.email = session.user.email || "";
  await loadMe();
  sb.channel("me-live").on("postgres_changes", { event: "*", schema: "public", table: "players", filter: `id=eq.${S.me}` }, () => loadMe()).subscribe();
  const q = new URLSearchParams(location.search);
  if (q.get("state") === "strava") {
    history.replaceState(null, "", location.pathname);
    if (q.get("code") && q.get("scope")?.includes("activity:read")) await stravaConnect(q.get("code"));
    else toast("O Strava não liberou a leitura das atividades. Tente de novo e deixe a opção marcada.");
  } else if (S.p?.strava?.connected) {
    const last = S.p.strava.lastSync ? Date.parse(S.p.strava.lastSync) : 0;
    if (Date.now() - last > 60 * 60 * 1000) stravaSync(true);
  }
}

async function loadMe() {
  const { data, error } = await sb.from("players").select("*").eq("id", S.me).maybeSingle();
  if (error) { S.error = error.message; S.loaded = true; render(); return; }
  S.p = data ? { nick: data.nick, mascot: data.mascot, goal: data.goal, height: data.height, color: data.color, measurements: data.measurements || [], checkins: data.checkins || [], strava: data.strava || null } : null;
  S.loaded = true; S.error = "";
  render();
}

let writing = Promise.resolve();
function saveMe(p) {
  S.p = p; render();
  if (S.mode === "demo") return Promise.resolve(true);
  const row = { id: S.me, nick: p.nick, mascot: p.mascot, goal: p.goal, height: p.height, color: p.color, measurements: p.measurements, checkins: p.checkins, strava: p.strava || null };
  writing = writing.then(async () => {
    const { error } = await sb.from("players").upsert(row);
    if (error) {
      toast(/row-level security/i.test(error.message) ? "Seu e-mail ainda não está liberado no banco (passo 3 do README)." : "Não foi possível salvar: " + error.message);
      await loadMe(); return false;
    }
    return true;
  });
  return writing;
}

function startDemo(notConfigured) {

// ---------- Strava ----------
function stravaAuthorize() {
  const u = new URL("https://www.strava.com/oauth/authorize");
  u.search = new URLSearchParams({ client_id: cfg.stravaClientId, response_type: "code", redirect_uri: pageUrl(), approval_prompt: "auto", scope: "activity:read_all", state: "strava" });
  location.href = u.toString();
}
async function callStrava(body) {
  const { data, error } = await sb.functions.invoke("strava", { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  return data;
}
async function stravaConnect(code) {
  try {
    const r = await callStrava({ action: "connect", code });
    const p = clone(S.p || {}); p.strava = { connected: true, athlete: r.athlete || "", lastSync: null, activities: [] };
    await saveMe(p);
    toast("Strava conectado! Buscando seus treinos…");
    await stravaSync(false);
  } catch (e) { toast("Não consegui conectar o Strava: " + e.message); }
}
async function stravaSync(quiet) {
  if (S.mode === "demo") { toast("Na demonstração os treinos do Strava são de exemplo."); return; }
  if (S.syncing || !S.p) return;
  S.syncing = true; renderStrava();
  try {
    const known = (S.p.strava?.activities || []).filter(a => counts(a.date));
    let since = S.p.strava?.lastSync ? Date.parse(S.p.strava.lastSync) / 1000 - 3 * 86400 : Date.now() / 1000 - 90 * 86400;
    if (START) since = Math.max(since, Date.parse(START + "T00:00:00Z") / 1000 - 86400);
    const r = await callStrava({ action: "activities", after: Math.floor(since) });
    const got = (r.activities || []).filter(a => counts(a.date));
    const before = stats(S.p);
    const p = clone(S.p);
    const ids = new Set(known.map(a => a.id));
    const fresh = got.filter(a => !ids.has(a.id));
    const merged = [...fresh, ...known.map(a => got.find(x => x.id === a.id) || a)].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 120);
    const set = new Set((p.checkins || []).filter(counts));
    for (const a of fresh) if (a.date <= TODAY) set.add(a.date);
    p.checkins = [...set].sort();
    p.strava = { ...(p.strava || {}), connected: true, lastSync: new Date().toISOString(), activities: merged };
    S.syncing = false;
    await commit(p, fresh.length ? `${fresh.length} ${fresh.length === 1 ? "treino novo" : "treinos novos"} do Strava.` : quiet ? "" : "Strava em dia, nada novo.", before);
  } catch (e) {
    S.syncing = false; renderStrava();
    if (/não conectado|not connected/i.test(e.message)) { const p = clone(S.p); p.strava = null; await saveMe(p); }
    if (!quiet || !/fetch/i.test(e.message)) toast("Falha ao sincronizar o Strava: " + e.message);
  }
}
async function stravaDisconnect() {
  try { if (S.mode !== "demo") await callStrava({ action: "disconnect" }); } catch {}
  const p = clone(S.p); p.strava = null; await saveMe(p);
  toast("Strava desconectado. Os dias de treino já marcados continuam no calendário.");
}

// ---------- desenho ----------
function barbell(L) {
  const plates = PLATES.slice(0, Math.min(L - 1, 9)).slice().sort((a, b) => b - a);
  const dims = { 10: [7, 44], 15: [8, 54], 20: [9, 66], 25: [10, 76] };
  const W = 260, cy = 44, cL = 86, cR = 174, room = 64;
  const total = plates.reduce((s, w) => s + dims[w][0] + 1.5, 0);
  const k = total > room ? room / total : 1;
  let out = `<svg class="barbell" viewBox="0 0 ${W} 88" role="img" aria-label="Barra com ${loadOf(L)} kg">`;
  out += `<rect x="14" y="${cy - 3}" width="${W - 28}" height="6" rx="3" fill="var(--bar)"/>`;
  out += `<rect x="${cL}" y="${cy - 2}" width="${cR - cL}" height="4" fill="var(--muted)" opacity=".35"/>`;
  out += `<rect x="${cL - 4}" y="${cy - 8}" width="4" height="16" rx="1" fill="var(--bar)"/><rect x="${cR}" y="${cy - 8}" width="4" height="16" rx="1" fill="var(--bar)"/>`;
  let xl = cL - 5, xr = cR + 5;
  for (const w of plates) {
    const pw = dims[w][0] * k, h = dims[w][1];
    xl -= pw;
    out += `<rect x="${xl.toFixed(1)}" y="${cy - h / 2}" width="${pw.toFixed(1)}" height="${h}" rx="2" fill="${PLATE_COLOR[w]}"/>`;
    out += `<rect x="${xr.toFixed(1)}" y="${cy - h / 2}" width="${pw.toFixed(1)}" height="${h}" rx="2" fill="${PLATE_COLOR[w]}"/>`;
    xl -= 1.5 * k; xr += pw + 1.5 * k;
  }
  if (!plates.length) out += `<text x="${W / 2}" y="${cy + 26}" text-anchor="middle" font-size="11" fill="var(--muted)">barra vazia, bora carregar</text>`;
  return out + `</svg>`;
}

function sparkline(ms, k) {
  const pts = ms.filter(m => isNum(m[k]));
  if (pts.length < 2) return `<svg class="spark" viewBox="0 0 96 26"></svg>`;
  const vs = pts.map(m => m[k]), lo = Math.min(...vs), hi = Math.max(...vs), r = hi - lo || 1;
  const t0 = dayNum(pts[0].date), t1 = dayNum(pts[pts.length - 1].date), tr = t1 - t0 || 1;
  const xy = pts.map(m => [4 + (dayNum(m.date) - t0) / tr * 88, 22 - (m[k] - lo) / r * 18]);
  const [ex, ey] = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 96 26" aria-hidden="true"><polyline points="${xy.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--pc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3" fill="var(--pc)"/></svg>`;
}

function chartSvg(k) {
  const metric = METRICS.find(m => m.k === k);
  const pts = sortedMs(S.p).filter(m => isNum(m[k])).map(m => ({ t: dayNum(m.date), v: m[k], date: m.date }));
  if (!pts.length) return `<p class="note">Nenhum dado de ${esc(metric.label.toLowerCase())} ainda.</p>`;
  const W = 680, H = 260, ml = 52, mr = 70, mt = 18, mb = 34;
  let t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  if (t0 === t1) { t0 -= 7; t1 += 7; }
  let v0 = Math.min(...pts.map(p => p.v)), v1 = Math.max(...pts.map(p => p.v));
  if (v1 - v0 < 2) { const m = (v0 + v1) / 2; v0 = m - 1; v1 = m + 1; }
  const steps = [0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50];
  const step = steps.find(s => (v1 - v0) / s <= 5) || 100;
  v0 = Math.floor(v0 / step) * step; v1 = Math.ceil(v1 / step) * step;
  const x = t => ml + (t - t0) / (t1 - t0) * (W - ml - mr);
  const y = v => mt + (v1 - v) / (v1 - v0) * (H - mt - mb);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(metric.label)} ao longo do tempo">`;
  for (let v = v0; v <= v1 + 1e-9; v += step) {
    const yy = y(v).toFixed(1);
    g += `<line x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>`;
    g += `<text x="${ml - 8}" y="${yy}" dy="4" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v, 2)}</text>`;
  }
  const every = Math.ceil(pts.length / 6);
  pts.forEach((p, i) => { if (i % every === 0 || i === pts.length - 1) g += `<text x="${x(p.t).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtDate(p.date)}</text>`; });
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts[pts.length - 1].t).toFixed(1)},${y(v0)} L${x(pts[0].t).toFixed(1)},${y(v0)} Z`;
  if (pts.length > 1) g += `<path d="${area}" fill="var(--pc)" opacity=".1"/>`;
  g += `<path d="${line}" fill="none" stroke="var(--pc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  for (const p of pts) g += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4.5" fill="var(--surface)" stroke="var(--pc)" stroke-width="2.5"><title>${fmtDateLong(p.date)}: ${fmt(p.v)} ${metric.unit}</title></circle>`;
  const l = pts[pts.length - 1];
  g += `<text x="${(x(l.t) + 10).toFixed(1)}" y="${y(l.v).toFixed(1)}" dy="4" font-size="13" font-weight="700" fill="var(--ink)">${fmt(l.v)} ${metric.unit}</text>`;
  return g + `</svg>`;
}

function renderHero() {
  const el = $("#hero");
  if (S.mode === "login") { el.hidden = true; return; }
  el.hidden = false;
  if (!S.loaded) { el.innerHTML = `<div class="athlete"><h2>Carregando…</h2></div>`; return; }
  const p = S.p;
  if (!p) {
    el.innerHTML = `<div class="athlete"><div class="a-main"><div class="a-id"><h2 style="font-size:40px">Bem-vindo à barra</h2>
      <p style="margin:0;color:var(--muted)">Crie seu perfil para começar com a barra vazia de 20 kg. Cada medição e cada treino coloca anilhas nela.</p>
      <div class="actions"><button class="btn primary" type="button" data-act="profile">Criar meu perfil</button></div></div>${barbell(1)}</div></div>`;
    return;
  }
  const st = stats(p);
  const pct = Math.min(100, (st.xp - st.from) / (st.to - st.from) * 100);
  const next = st.nextIn === null ? "registre já" : st.nextIn <= 0 ? "hoje!" : st.nextIn === 1 ? "amanhã" : `em ${st.nextIn} dias`;
  const trained = (p.checkins || []).includes(TODAY);
  el.innerHTML = `<div class="athlete">
    <div class="a-main">
      <div class="a-id">
        <div class="f-top">
          <div class="mascot" aria-hidden="true">${esc(p.mascot || "🏋️")}</div>
          <div class="f-name"><h2>${esc(p.nick)}</h2><p>Objetivo: ${esc(GOALS[p.goal] || "Recomposição")}${p.height ? ` · ${fmt(p.height, 0)} cm` : ""}</p></div>
          <button class="btn small" type="button" data-act="profile">Editar</button>
        </div>
        <div class="loadline"><span class="load num">${st.load}<small>kg</small></span><span class="lvl">Nível ${st.level}</span></div>
      </div>
      ${barbell(st.level)}
    </div>
    <div class="xpbar" role="progressbar" aria-valuemin="${st.from}" aria-valuemax="${st.to}" aria-valuenow="${st.xp}" aria-label="Experiência"><i style="width:${pct.toFixed(1)}%"></i></div>
    <p class="xptext num">${st.xp} XP · faltam ${st.to - st.xp} para a barra de ${st.nextLoad} kg</p>
    <dl class="fstats num">
      <div><dt>Progresso</dt><dd>${signed(st.score)} pts</dd></div>
      <div><dt>Dias de treino</dt><dd>${st.checkins.length}</dd></div>
      <div><dt>Sequência</dt><dd>${st.streak} ${st.streak === 1 ? "semana" : "semanas"}</dd></div>
      <div><dt>Medir de novo</dt><dd>${next}</dd></div>
    </dl>
    <div class="actions">
      <button class="btn primary" type="button" data-act="measure">Registrar medidas</button>
      <button class="btn ${trained ? "" : "go"}" type="button" data-act="checkin" aria-pressed="${trained}">${trained ? "Treino de hoje marcado ✓" : "Treinei hoje (+25 XP)"}</button>
      <span class="hint">Medição vale ${XP.measure} XP e cada medida que melhora vale mais ${XP.improve}.</span>
    </div>
  </div>`;
}

function renderMetrics() {
  const p = S.p, st = stats(p), ms = st.ms;
  const rows = METRICS.filter(m => ms.some(x => isNum(x[m.k]))).map(m => {
    const a = firstVal(ms, m.k), pv = prevVal(ms, m.k), l = lastVal(ms, m.k), d = dirOf(m, st.goal);
    const tot = isNum(a) && isNum(l) ? l - a : null;
    const cls = !tot || !d ? "" : d * tot > 0 ? "good" : "bad";
    return `<tr><td><b>${m.label}</b></td><td class="r num">${fmt(a)} ${m.unit}</td><td class="r num">${fmt(pv)}</td><td class="r num"><b>${fmt(l)}</b></td>
      <td class="r num">${tot === null || ms.length < 2 ? "–" : `<span class="delta ${cls}">${signed(tot)} ${m.unit}</span>`}</td><td>${sparkline(ms, m.k)}</td></tr>`;
  });
  const w = lastVal(ms, "weight");
  if (p.height && isNum(w)) {
    const h2 = Math.pow(p.height / 100, 2), imc = w / h2, imc0 = firstVal(ms, "weight") / h2;
    rows.push(`<tr><td><b>IMC</b></td><td class="r num">${fmt(imc0, 1)}</td><td class="r num">–</td><td class="r num"><b>${fmt(imc, 1)}</b></td><td class="r num">${ms.length < 2 ? "–" : `<span class="delta">${signed(imc - imc0, 1)}</span>`}</td><td></td></tr>`);
  }
  $("#metrics").innerHTML = `<div class="sec-head"><div><h2>Medidas</h2><p>Verde é movimento a favor do seu objetivo (${esc(GOALS[st.goal]).toLowerCase()}); vermelho é contra; cinza não pesa para o objetivo.</p></div></div>
    <div class="panel">${rows.length ? `<div class="scroll"><table><thead><tr><th>Medida</th><th class="r">Início</th><th class="r">Anterior</th><th class="r">Atual</th><th class="r">Total</th><th>Tendência</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`
      : `<p class="note">Nenhuma medição ainda. Comece pela de 15 dias atrás: dá para escolher a data no formulário.</p>`}</div>`;
}

function renderChart() {
  const avail = METRICS.filter(m => (S.p.measurements || []).some(x => isNum(x[m.k])));
  if (!avail.length) { $("#chart").hidden = true; return; }
  if (!avail.some(m => m.k === S.chart)) S.chart = avail[0].k;
  $("#chart").innerHTML = `<div class="sec-head"><div><h2>Linha do tempo</h2><p>Cada ponto é uma medição. Passe o dedo ou o mouse para ver o valor.</p></div>
    <div class="chips" role="group" aria-label="Escolher medida">${avail.map(m => `<button class="chip" type="button" data-act="chart" data-k="${m.k}" aria-pressed="${m.k === S.chart}">${m.label}</button>`).join("")}</div></div>
    <div class="panel chart">${chartSvg(S.chart)}</div>`;
}

function renderCalendar() {
  const WEEKS = 16, end = mondayOf(TODAY) + 6, start = end - 7 * WEEKS + 1;
  const wds = ["Seg", "", "Qua", "", "Sex", "", "Dom"];
  const set = new Set(S.p.checkins || []), meas = new Set((S.p.measurements || []).map(m => m.date));
  const fromStrava = new Set((S.p.strava?.activities || []).map(a => a.date));
  const st = stats(S.p);
  let cells = "";
  for (let r = 0; r < 7; r++) {
    cells += `<span class="wd">${wds[r]}</span>`;
    for (let c = 0; c < WEEKS; c++) {
      const d = fromDay(start + c * 7 + r), fut = d > TODAY || !counts(d), on = set.has(d) && counts(d);
      const cls = ["cell", on ? (fromStrava.has(d) ? "strava" : "on") : "", meas.has(d) ? "meas" : "", d === TODAY ? "today" : "", fut ? "future" : ""].join(" ");
      const label = `${fmtDateLong(d)}${on ? ", treinou" : ""}${on && fromStrava.has(d) ? " (Strava)" : ""}${meas.has(d) ? ", mediu" : ""}`;
      cells += fut ? `<span class="${cls}" title="${label}"></span>` : `<button type="button" class="${cls}" data-act="ck" data-d="${d}" aria-label="${label}" aria-pressed="${on}" title="${label}"></button>`;
    }
  }
  const thisWeek = st.weeks.get(mondayOf(TODAY)) || 0;
  $("#calendar").innerHTML = `<div class="sec-head"><div><h2>Frequência</h2><p>Últimas ${WEEKS} semanas. Toque num dia para marcar ou desmarcar treino.${START && S.mode !== "demo" ? ` Conta a partir de ${fmtDate(START)}.` : ""} Meta: 3 por semana para manter a sequência.</p></div></div>
    <div class="panel"><div class="cal-wrap"><div class="cal">${cells}</div>
      <div class="cal-side"><div><div class="big num">${thisWeek}/3</div><small>treinos nesta semana</small></div><div><div class="big num">${st.streak}</div><small>semanas seguidas na meta</small></div></div></div>
      <div class="cal-legend" style="margin-top:12px"><span><i style="background:var(--pc)"></i>treino marcado</span><span><i style="background:var(--strava)"></i>treino do Strava</span><span><i style="background:var(--sunken);box-shadow:inset 0 0 0 3px var(--sunken), inset 0 0 0 6px var(--surface)"></i>dia de medição</span></div></div>`;
}

  const el = $("#strava");
  if (!S.p) return;
  const sv = S.p.strava;
  let body;
  if (!sv?.connected) {
    body = stravaReady || S.mode === "demo"
      ? `<p style="margin:0 0 12px;color:var(--muted)">Conecte sua conta e os treinos que você registra no Strava viram dias de treino aqui automaticamente, valendo XP.</p><button class="btn strava" type="button" data-act="stravaconnect">Conectar com Strava</button>`
      : `<p class="note">A integração ainda não foi configurada. O README explica como criar o app no Strava e colocar o <b>stravaClientId</b> no config.js.</p>`;
  } else {
    const acts = (sv.activities || []).slice(0, 8);
    body = `<div class="actions" style="margin-bottom:8px"><button class="btn small" type="button" data-act="stravasync" ${S.syncing ? "disabled" : ""}>${S.syncing ? "Sincronizando…" : "Sincronizar agora"}</button>
      <span class="hint">${sv.lastSync ? `Última sincronização: ${new Date(sv.lastSync).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}` : "Ainda não sincronizado"}</span>
      <button class="btn small danger" type="button" data-act="stravaoff" style="margin-left:auto">${S.armed === "strava" ? "Confirmar" : "Desconectar"}</button></div>
      ${acts.length ? `<div class="acts">${acts.map(a => `<div class="act"><span class="d num">${fmtDate(a.date)}</span><div class="t"><b>${esc(a.name || SPORTS[a.type] || a.type)}</b><small>${esc(SPORTS[a.type] || a.type)}</small></div>
        <span class="m num">${dur(a.moving_time || 0)}${a.distance > 0 ? `<br>${fmt(a.distance / 1000)} km` : ""}</span></div>`).join("")}</div>`
        : `<p class="note">Nenhuma atividade nos últimos 90 dias.</p>`}`;
  }
  el.innerHTML = `<div class="sec-head"><div><h2>Strava</h2><p>${sv?.connected ? `Conectado${sv.athlete ? ` como ${esc(sv.athlete)}` : ""}. Treinos novos entram sozinhos quando você abre a página.` : "Opcional."}</p></div></div><div class="panel">${body}</div>`;

function measureSheet(editId) {
  const ms = sortedMs(S.p);
  const cur = editId ? ms.find(m => m.id === editId) : null;
  const ph = k => { const v = lastVal(ms, k); return isNum(v) ? `última: ${fmt(v)}` : ""; };
  openSheet(`<h2 id="sheetTitle">${cur ? "Corrigir medição" : "Registrar medidas"}</h2>
    <form class="form" id="measureForm" data-edit="${esc(editId || "")}">
      <div class="field" style="max-width:220px"><label for="mf-date">Data da medição</label><input id="mf-date" type="date" required max="${TODAY}" value="${cur ? cur.date : TODAY}"></div>
      <div class="grid2">${METRICS.map(m => `<div class="field"><label for="mf-${m.k}">${m.label}</label><div class="unit"><input id="mf-${m.k}" inputmode="decimal" autocomplete="off" value="${cur && isNum(cur[m.k]) ? String(cur[m.k]).replace(".", ",") : ""}" placeholder="${ph(m.k)}"><span>${m.unit}</span></div></div>`).join("")}</div>
      <div class="field"><label for="mf-note">Observação (opcional)</label><input id="mf-note" maxlength="120" value="${esc(cur?.note || "")}" placeholder="Ex.: medido em jejum, bioimpedância da academia"></div>
      <p style="margin:0;color:var(--muted);font-size:13px">Preencha só o que mediu. Se já existir medição nessa data, os valores entram nela.</p>
      <div class="sheet-foot"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn primary" type="submit">Salvar medição</button></div>
    </form>`);
}

async function commit(next, baseMsg, beforeStats) {
  const before = beforeStats || (S.p ? stats(S.p) : null);
  const ok = await saveMe(next);
  if (ok === false) return;
  const after = stats(next);
  const gained = after.xp - (before ? before.xp : 0);
  if (baseMsg) toast(`${baseMsg}${gained > 0 ? ` +${gained} XP` : ""}`);
  const up = before && after.level > before.level;
  if (up) { toast(`Subiu de nível! Barra com ${after.load} kg`, "lvlup"); confetti(); }
  const newB = before ? after.badges.filter(b => !before.badges.includes(b)) : [];
  for (const id of newB) toast(`Conquista desbloqueada: ${BADGES.find(x => x.id === id).name}`);
  if (newB.length && !up) confetti(0.5);
}

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "loginForm") {
    const email = $("#lg-email").value.trim(), pw = $("#lg-pw")?.value || "", mode = f.dataset.mode;
    if (!email) return;
    if (mode === "signup" && pw !== $("#lg-pw2").value) return toast("As senhas não são iguais.");
    S.lastEmail = email; $("#lg-btn").disabled = true;
    const done = (msg) => { S.sent = msg; render(); };
    if (mode === "login") {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (!error) return;
      $("#lg-btn").disabled = false;
      if (/confirm/i.test(error.message)) return done(`Falta confirmar o e-mail: abra o link que mandamos para <b>${esc(email)}</b> e depois entre com a senha.`);
      return toast(/invalid/i.test(error.message) ? "E-mail ou senha errados. Se nunca criou senha, use “Esqueci a senha”." : "Não consegui entrar: " + error.message);
    }
    if (mode === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: pageUrl() } });
      if (error) { $("#lg-btn").disabled = false; return toast("Não consegui criar a conta: " + error.message); }
      if (data.session) return;
      if (data.user && !data.user.identities?.length) { S.auth = "forgot"; return done(`<b>${esc(email)}</b> já tem conta. Peça o link abaixo para criar ou trocar a senha.`); }
      S.auth = "login"; return done(`Conta criada. Abra o link que mandamos para <b>${esc(email)}</b> para confirmar e depois entre com a senha.`);
    }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl() });
    if (error) { $("#lg-btn").disabled = false; return toast("Não consegui enviar: " + error.message); }
    done(`Link enviado para <b>${esc(email)}</b>. Abra e escolha a senha nova.`);
  }
  if (f.id === "pwForm") {
    const pw = $("#pw-new").value;
    if (pw !== $("#pw-new2").value) return toast("As senhas não são iguais.");
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) return toast("Não consegui salvar: " + error.message);
    closeSheet(); toast("Senha salva. Da próxima vez, entre com e-mail e senha.");
  }
  if (f.id === "profileForm") {
    const nick = $("#pf-nick").value.trim(); if (!nick) return;
    let h = parseDec($("#pf-height").value);
    if (isNum(h) && h > 0 && h < 3) h = Math.round(h * 100); // aceita 1,69 m como 169 cm
    const isNew = !S.p;
    const cur = S.p ? clone(S.p) : { measurements: [], checkins: [], strava: null };
    Object.assign(cur, { nick, mascot: f.querySelector("[name=pf-mascot]:checked")?.value || "🏋️", color: f.querySelector("[name=pf-color]:checked")?.value || "p25", goal: f.querySelector("[name=pf-goal]:checked")?.value || "recomp", height: isNum(h) ? h : null });
    closeSheet();
    await commit(cur, isNew ? "Perfil criado! Registre a medição de 15 dias atrás e a de hoje." : "Perfil atualizado.");
  }
  if (f.id === "measureForm") {
    const date = $("#mf-date").value;
    if (!date || date > TODAY) { toast("Escolha uma data até hoje."); return; }
    const vals = {}; let bad = false;
    for (const m of METRICS) { const v = parseDec($("#mf-" + m.k).value); if (v === null) continue; if (!isNum(v) || v <= 0) bad = m.label; else vals[m.k] = Math.round(v * 100) / 100; }
    if (bad) { toast(`Valor inválido em ${bad}. Use números, como 82,5.`); return; }
    if (!Object.keys(vals).length) { toast("Preencha pelo menos uma medida."); return; }
    const note = $("#mf-note").value.trim();
    const me = clone(S.p); me.measurements = me.measurements || [];
    const editId = f.dataset.edit;
    if (editId) {
      const i = me.measurements.findIndex(m => m.id === editId);
      me.measurements[i] = { id: editId, date, ...vals, ...(note ? { note } : {}) };
    } else {
      const same = me.measurements.find(m => m.date === date);
      if (same) { Object.assign(same, vals); if (note) same.note = note; }
      else me.measurements.push({ id: "m" + Date.now().toString(36), date, ...vals, ...(note ? { note } : {}) });
    }
    closeSheet();
    await commit(me, editId ? "Medição corrigida." : "Medição salva!");
  }
});

document.addEventListener("click", async e => {
  if (e.target === $("#sheet")) return closeSheet();
  const t = e.target.closest("[data-act]");
  const act = t?.dataset.act;
  if (S.armed && act !== "del" && act !== "stravaoff") { S.armed = null; renderHistory(); renderStrava(); }
  if (!t) return;
  if (act === "close") closeSheet();
  else if (act === "profile") profileSheet();
  else if (act === "measure") measureSheet();
  else if (act === "edit") measureSheet(t.dataset.id);
  else if (act === "chart") { S.chart = t.dataset.k; renderChart(); }
  else if (act === "demo") startDemo(false);
  else if (act.startsWith("auth-")) { S.auth = act.slice(5); S.sent = ""; render(); }
  else if (act === "password") passwordSheet(false);
  else if (act === "exitdemo") location.reload();
  else if (act === "logout") await sb.auth.signOut();
  else if (act === "stravaconnect") S.mode === "demo" ? toast("Na demonstração não dá para conectar. Entre com seu e-mail primeiro.") : stravaAuthorize();
  else if (act === "stravasync") stravaSync(false);
  else if (act === "stravaoff") {
    if (S.armed !== "strava") { S.armed = "strava"; renderStrava(); return; }
    S.armed = null; stravaDisconnect();
  }
  else if (act === "checkin" || act === "ck") {
    const d = act === "ck" ? t.dataset.d : TODAY;
    const me = clone(S.p); const set = new Set(me.checkins || []);
    const adding = !set.has(d);
    adding ? set.add(d) : set.delete(d);
    me.checkins = [...set].sort();
    await commit(me, adding ? `Treino de ${d === TODAY ? "hoje" : fmtDate(d)} marcado.` : "Treino desmarcado.");
  }
  else if (act === "del") {
    if (S.armed !== t.dataset.id) { S.armed = t.dataset.id; renderHistory(); return; }
    S.armed = null;
    const me = clone(S.p); me.measurements = me.measurements.filter(m => m.id !== t.dataset.id);
    await commit(me, "Medição apagada.");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

// ---------- feedback ----------
function toast(msg, kind) {
  const el = document.createElement("div"); el.className = "toast " + (kind || ""); el.textContent = msg;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), kind === "lvlup" ? 4200 : 3400);
}
function confetti(scale = 1) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), ctx = c.getContext("2d"); c.hidden = false;
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const cols = ["--p10", "--p15", "--p20", "--p25"].map(v => css.getPropertyValue(v).trim());
  const bits = Array.from({ length: Math.round(140 * scale) }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, w: 6 + Math.random() * 8, h: 10 + Math.random() * 14, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * 4)] }));
  const t0 = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) { b.vy += .45; b.x += b.vx; b.y += b.vy; b.r += b.vr; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore(); }
    if (now - t0 < 2200) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  })(t0);
}

boot();
